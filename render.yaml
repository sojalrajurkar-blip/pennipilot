services:
  - type: web
    name: pennypilot-backend
    env: docker
    dockerfilePath: pennypilot-backend/Dockerfile
    context: pennypilot-backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app
      # Supabase PostgreSQL Connection details:
      # e.g., jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false
