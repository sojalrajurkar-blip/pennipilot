services:
  postgres:
    image: postgres:16-alpine
    container_name: pennypilot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pennypilot
      POSTGRES_USER: pennypilot
      POSTGRES_PASSWORD: pennypilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pennypilot -d pennypilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: pennypilot-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pennypilot
      DB_USERNAME: pennypilot
      DB_PASSWORD: pennypilot
      SERVER_PORT: 8080

volumes:
  postgres_data:
