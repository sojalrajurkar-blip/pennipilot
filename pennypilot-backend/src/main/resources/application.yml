spring:
  application:
    name: pennypilot-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pennypilot}}}
    username: ${DB_USERNAME:pennypilot}
    password: ${DB_PASSWORD:pennypilot}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:${SERVER_PORT:8080}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

